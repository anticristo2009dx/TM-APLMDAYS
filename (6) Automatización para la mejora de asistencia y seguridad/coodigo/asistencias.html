<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabla de asistencias</title>
    <style>
      * {
        box-sizing: border-box;
      }
@import url('https://fonts.googleapis.com/css2?family=SUSE+Mono:ital,wght@0,100..800;1,100..800&display=swap');

html, body {

  height: 100%;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #305baa, #72b2fc);
  font-family: "SUSE Mono", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
  box-sizing: border-box;
      display: flex;
      justify-content: center;
}

      .card {
        width: 100%;
        max-width: 800px;
        background: white;
        padding: 18px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(30, 40, 60, 0.06);
      }

      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 16px;
        color: #555;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 600px;
      }

      thead th {
        text-align: left;
        padding: 10px 12px;
        background: linear-gradient(180deg, #2b6cb0, #2c5282);
        color: white;
        font-weight: 600;
        letter-spacing: 0.3px;
      }

      tbody td {
        padding: 10px 12px;
        border-bottom: 1px solid #e9eef6;
      }

      tbody tr:nth-child(odd) {
        background: #fbfdff;
      }

      tbody tr:hover {
        background: #eef6ff;
      }

      .center {
        text-align: center;
      }
      .right {
        text-align: right;
      }

      .nota {
        font-size: 13px;
        color: #666;
        margin-top: 12px;
      }

      .btn {
        display: inline-block;
        margin-top: 8px;
        padding: 8px 12px;
        border-radius: 6px;
        background: #2c5282;
        color: white;
        text-decoration: none;
        font-size: 14px;
      }
      .navbar {
        background: rgba(255, 255, 255, 0.6);
        border-radius: 10px;
        height: 100%;
        width: 60px;
        position: fixed;
        top: 0;
        left: 0;
        transition: width 0.4s ease;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 60px;
        z-index: 1000;
      }

      .navbar a {
        color: rgba(29, 59, 114, 0.8);
        text-decoration: none;
        margin: 15px 0;
        font-size: 14px;
        transition: all 0.3s ease;
        opacity: 0;
        pointer-events: none;
      }

      .navbar.expanded {
        width: 250px;
        align-items: flex-start;
        padding: 60px 20px;
      }

      .navbar.expanded ~ .index-box,
      .navbar.expanded ~ .desc {
        display: none;
      }

      .navbar.expanded a {
        opacity: 1;
        pointer-events: auto;
        color: #222;
        font-size: 16px;
        text-transform: uppercase;
      }

      .navbar.expanded a:hover {
        color: rgba(29, 59, 114, 0.8);
        letter-spacing: 2px;
      }

      .btn-expand {
        position: absolute;
        background-color: #1d3b72;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        padding: 10px;
        top: 50%;
        right: -20px;
        border-radius: 50%;
        height: 40px;
        width: 40px;
        transition: all 0.3s ease;
      }

      .btn-expand:hover {
        background-color: #3f77d0;
        transform: scale(1.1);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translate(-50%, -60%);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translate(-50%, -70%);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <button class="btn-expand" id="btn-expand">></button>
      <a href="inicio.html">inicio</a> <br />
      <a href="contacto.html">CONTACTO</a> <br />
      <a href="#">CERRAR SESION</a> <br />
    </nav>
    <div class="card">
      <h1>Tabla de Asistencias</h1>
      <p>
        Tabla que muestra las asistencias de los estudiantes, faltas y excusas
      </p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Matricula</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Asistió</th>
              <th>No asistió</th>
              <th class="center">Llegó tarde</th>
              <th class="right">llegó tarde con excusa</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>180545</td>
              <td>Julián</td>
              <td>Arboleda</td>
              <td>X</td>
              <td></td>
              <td></td>
              <td></td>
              <td class="center"></td>
              <td class="right"></td>
            </tr>
            <tr>
              <td>190470</td>
              <td>Diego Antonio</td>
              <td>Rivero</td>
              <td></td>
              <td>X</td>
              <td></td>
              <td class="center"></td>
              <td class="right"></td>
            </tr>
            <tr>
              <td></td>
              <td></td>
              <td></td>
              <td class="center"></td>
              <td class="right"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script>
      const btnExpand = document.getElementById("btn-expand");
      const navbar = document.querySelector(".navbar");
      btnExpand.addEventListener("click", () => {
        navbar.classList.toggle("expanded");
        if (navbar.classList.contains("expanded")) {
          btnExpand.textContent = "<";
        } else {
          btnExpand.textContent = ">";
        }
      });
    </script>
  </body>
</html>
