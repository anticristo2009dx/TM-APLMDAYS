<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ingreso seguro</title>

  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="shared1.css"/>
  <link rel="stylesheet" href="login.css"/>
</head>
<body class="login-page">

  <!-- Contenedor de Login -->
  <main class="login-container">

    <!-- Encabezado -->
    <header class="login-brand">

      </div>
      <h1>INGRESO SEGURO</h1>
      <p>Acceso al Centro de Control Administrativo</p>
    </header>

    <!-- Tarjeta -->
    <section class="login-card">
      <form class="login-form" novalidate>

        <!-- Campos -->
        <div class="login-fields">

          <!-- Email -->
          <div class="field">
            <label for="email">Correo del Administrador</label>
            <div class="input-icon-wrap">
              <input
                id="email"
                name="email"
                type="email"
              />
            </div>
          </div>

          <!-- Contraseña -->
          <div class="field">
            <div class="field-label-row">
              <label for="password">Contraseña Segura</label>
            </div>
            <div class="input-icon-wrap">
              <input
                id="password"
                name="password"
                type="password"
              />
              <button class="input-action" type="button" aria-label="Mostrar u ocultar contraseña">
                <span class="material-symbols-outlined"></span>
              </button>
            </div>
          </div>

        </div>



        <!-- Botón -->
        <button class="login-submit" type="submit">
          <span class="material-symbols-outlined"></span>
          Iniciar Sesión
        </button>


  </main>

</body>
</html>
